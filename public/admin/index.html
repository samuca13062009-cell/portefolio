<!doctype html>
<html lang="pt-PT" data-skin="polvo" data-skins="polvo saltaplanetas skillconnect arduino">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Backoffice — Portefólio</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/themes.css">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/js/theme.js"></script>
</head>
<body class="admin">

<div class="login" id="login" hidden>
<div class="login-brand">
<div class="brand">Portefólio</div>
<div>
<p class="mono">Backoffice</p>
<p class="login-claim">Gere o teu portefólio sem tocar no código.</p>
</div>
<p class="small">Projetos · Conteúdos · Contactos</p>
</div>
<main class="login-main">
<form id="login-form" novalidate>
<div>
<h1 class="display sm">Iniciar sessão</h1>
<p class="muted">Área reservada ao administrador do website.</p>
</div>
<div class="field"><label for="l-user">Utilizador</label><input id="l-user" type="text" autocomplete="username" required></div>
<div class="field"><label for="l-pass">Palavra-passe</label><input id="l-pass" type="password" autocomplete="current-password" required></div>
<p class="error" id="login-error" role="alert" hidden></p>
<button class="btn primary big" type="submit">Entrar</button>
<a class="text-link center" href="/">Voltar ao website</a>
</form>
</main>
</div>

<div class="app" id="app" hidden>
<aside class="side">
<div class="side-head">
<div class="brand">Portefólio</div>
<div class="mono">Backoffice</div>
</div>
<nav class="side-nav" aria-label="Backoffice">
<button type="button" class="side-link" data-view="dashboard">Dashboard</button>
<button type="button" class="side-link" data-view="projects">Projetos</button>
<button type="button" class="side-link" data-view="content">Conteúdos</button>
<button type="button" class="side-link" data-view="themes">Aparência</button>
<button type="button" class="side-link" data-view="messages">Contactos <span class="badge" id="unread-badge" hidden></span></button>
<button type="button" class="side-link" data-view="account">Conta</button>
</nav>
<div class="side-theme">
<label class="mono" for="skin-select">Cores do backoffice</label>
<select id="skin-select"></select>
<div class="mode-switch" role="group" aria-label="Modo">
<button type="button" class="mode-opt" data-mode="light" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Claro</button>
<button type="button" class="mode-opt" data-mode="dark" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Escuro</button>
</div>
</div>
<div class="side-nav side-foot">
<a class="side-link" href="/" target="_blank" rel="noopener">Ver website<span class="sr"> (abre noutro separador)</span></a>
<button type="button" class="side-link" id="logout">Terminar sessão</button>
</div>
</aside>
<main class="main" id="main" tabindex="-1"></main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/admin/admin.js" defer></script>
</body>
</html>
