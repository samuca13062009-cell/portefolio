# Configuração do Netlify. As páginas são geradas pela função netlify/functions/site.mjs;
# os ficheiros de public/ são servidos diretamente.

[build]
  publish = "public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"

# Cabeçalhos de segurança também nos ficheiros estáticos.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-cache"
